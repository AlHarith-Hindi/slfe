<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLFE Opportunity Watch</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap">
<style>
/* SLFE look: teal-black band, petrol accent, slate text. Tabs, search, EN/AR. */
:root{--ink:#011C1A;--petrol:#004D69;--petrol-2:#0A6F93;--bg:#F4F7F7;--panel:#FFFFFF;--fg:#14211F;--muted:#5E626C;--line:#DCE4E5;--soft:#E7F0F3;--ok:#1F7A4D;--warn:#A86400;--bad:#B3261E;--accent:#004D69;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#071513;--panel:#0E1F1D;--fg:#E6EEEE;--muted:#9AA8AA;--line:#203533;--soft:#0F2A31;--ok:#5CC28C;--warn:#E5A23A;--bad:#F07167;--accent:#5FB3D3;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
html[lang=ar] body,[lang=ar]{font-family:"Noto Kufi Arabic","DM Sans",sans-serif}
html[lang=ar] body{font-size:14.5px;line-height:1.8}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main .wrap>*,.res>*,.cols>*{min-width:0}
header.band{background:var(--ink);color:#EAF2F2;border-bottom:4px solid var(--petrol)}
header.band .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:18px}
.brand{display:grid;gap:2px;min-width:0}
.brand .mark{font-weight:800;letter-spacing:.16em;font-size:12px;color:#9FC3CF}
html[lang=ar] .brand .mark{letter-spacing:0}
.brand h1{margin:0;font-size:24px;line-height:1.2;font-weight:700}
.brand .upd{font-size:12.5px;color:#A9BBBD}
.right{display:flex;gap:10px;align-items:center;flex:1 1 320px;max-width:520px}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;padding:10px 14px;padding-inline-end:36px;border-radius:8px;border:1px solid #2C4A4A;background:#0B2A2C;color:#EAF2F2;font:inherit}
.search input::placeholder{color:#8FA5A7}
.search input:focus,.lang:focus-visible{outline:2px solid var(--petrol-2);outline-offset:1px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:#9FC3CF;font-size:18px;cursor:pointer;padding:4px 8px}
.lang{flex:0 0 auto;border:1px solid #2C4A4A;background:#0B2A2C;color:#EAF2F2;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;min-width:52px}
.lang:hover{border-color:#9FC3CF}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:13px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .n{display:inline-block;min-width:20px;margin-inline-start:6px;padding:0 6px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
main .wrap{padding-block:24px 48px;display:grid;gap:22px}
main section{display:grid;gap:14px;align-content:start}
.sec-h{display:grid;gap:4px;border-inline-start:3px solid var(--petrol);padding-inline-start:12px}
.sec-h h2{margin:0;font-size:20px;color:var(--accent)}
.sec-h p{margin:0;color:var(--muted);max-width:75ch}
.take{font-size:19px;line-height:1.5;margin:0;max-width:70ch}
.take b{font-variant-numeric:tabular-nums;color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--petrol);border-radius:10px;padding:16px;display:grid;gap:4px;align-content:start}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
html[lang=ar] .tile .l,html[lang=ar] th,html[lang=ar] .res-h,html[lang=ar] .card .kind{letter-spacing:0}
.tile .v{font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px}
.col{display:grid;gap:12px;align-content:start}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
select,.tools label{font:inherit;font-size:13.5px}
select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:start;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--soft);padding:9px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;text-align:start}
td.n,td.d{font-variant-numeric:tabular-nums;white-space:nowrap}
td.ar{direction:rtl;text-align:right;min-width:260px}
td.ar small{display:block;color:var(--muted);margin-top:3px}
tr.closed td{opacity:.55}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid currentColor;white-space:nowrap;margin-top:3px}
.pill.Strong{color:var(--ok)}.pill.Medium{color:var(--accent)}.pill.soon{color:var(--bad)}.pill.dp{color:var(--warn)}.pill.closedp{color:var(--muted)}
.list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .kind{font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.card h3{margin:0;font-size:16px}
.card p{margin:0;max-width:80ch}
.card .why{background:var(--soft);border-radius:6px;padding:6px 10px}
.card .why b{color:var(--accent)}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
mark{background:#FFE58A;color:#111;border-radius:2px;padding:0 1px}
.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--petrol-2)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.res-h{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 0}
.res{display:grid;gap:8px}
.res button{all:unset;cursor:pointer;display:grid;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:start}
.res button:hover,.res button:focus-visible{border-color:var(--accent);outline:none}
.res .t{font-weight:600}
.res .m{font-size:12.5px;color:var(--muted)}
.res .x{font-size:13px}
footer{color:var(--muted);font-size:12.5px}
footer details summary{cursor:pointer;font-weight:600;color:var(--accent)}
footer ul{margin:8px 0 0;padding-inline-start:18px;display:grid;gap:4px}
.err{background:var(--panel);border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:14px}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brand">
      <span class="mark" data-t="mark"></span>
      <h1 data-t="title"></h1>
      <span class="upd" id="upd"></span>
    </div>
    <div class="right">
      <div class="search">
        <input id="q" type="search" autocomplete="off">
        <button id="qx" type="button" hidden>×</button>
      </div>
      <button class="lang" id="lang" type="button"></button>
    </div>
  </div>
</header>
<nav class="tabs" id="nav"><div class="wrap" id="tabs" role="tablist"></div></nav>
<main><div class="wrap" id="main">
  <section id="v-search" hidden></section>
  <section id="v-overview" data-tab="overview">
    <p class="take" id="take"></p>
    <div class="tiles" id="tiles"></div>
    <div class="cols">
      <div class="col"><div class="sec-h"><h2 data-t="soonH"></h2><p data-t="soonP"></p></div><div class="res" id="ov-soon"></div></div>
      <div class="col"><div class="sec-h"><h2 data-t="latestH"></h2><p data-t="latestP"></p></div><div class="res" id="ov-latest"></div></div>
    </div>
  </section>
  <section id="v-etimad" data-tab="etimad" hidden>
    <div class="sec-h"><h2 data-t="etH"></h2><p data-t="etP"></p></div>
    <div class="tools" id="et-tools">
      <button class="chip" type="button" data-fit="" aria-pressed="true" data-t="all"></button>
      <button class="chip" type="button" data-fit="Strong" aria-pressed="false" data-t="Strong"></button>
      <button class="chip" type="button" data-fit="Medium" aria-pressed="false" data-t="Medium"></button>
      <select id="et-disc"></select>
      <label><input type="checkbox" id="et-closed"> <span data-t="showClosed"></span></label>
    </div>
    <div class="tbl"><table><thead><tr><th data-t="thClose"></th><th data-t="thTender"></th><th data-t="thBuyer"></th><th data-t="thDisc"></th><th data-t="thFit"></th><th data-t="thBook"></th><th data-t="thRn"></th></tr></thead><tbody id="et-body"></tbody></table></div>
  </section>
  <section id="v-hcis" data-tab="hcis" hidden></section>
  <section id="v-gami" data-tab="gami" hidden></section>
  <section id="v-defense" data-tab="defense" hidden></section>
  <section id="v-supply" data-tab="supply" hidden></section>
  <section id="v-dates" data-tab="dates" hidden>
    <div class="sec-h"><h2 data-t="dtH"></h2><p data-t="dtP"></p></div>
    <div class="tbl"><table><thead><tr><th data-t="thDates"></th><th data-t="thEvent"></th><th data-t="thArea"></th><th data-t="thWhy"></th></tr></thead><tbody id="dt-body"></tbody></table></div>
  </section>
  <footer>
    <details><summary data-t="howH"></summary>
      <ul><li data-t="how1"></li><li data-t="how2"></li><li data-t="how3"></li><li data-t="how4"></li><li data-t="how5"></li></ul>
    </details>
  </footer>
</div></main>

 mon:['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],dow:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']}};
var SECS=[{id:'hcis',key:'HCIS'},{id:'gami',key:'GAMI'},{id:'defense',key:'Defense logistics'},{id:'supply',key:'Supply chain'}];
var TABS=['overview','etimad','hcis','gami','defense','supply','dates'];
var D=null,L='en',st={tab:'overview',fit:'',disc:'',closed:false,kind:{}},q0='';
try{var sv=localStorage.getItem('slfeLang');if(sv==='ar'||sv==='en')L=sv;}catch(e){}
function t(k){return T[L][k];}
function $(id){return document.getElementById(id);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function f(r,k){return L==='ar'&&r[k+'Ar']?r[k+'Ar']:r[k];}
function hp(){var o={};location.hash.slice(1).split('&').forEach(function(p){var i=p.indexOf('=');if(i>0)o[p.slice(0,i)]=decodeURIComponent(p.slice(i+1));});return o;}
function setHash(tab){var k=hp().k;history.replaceState(null,'','#'+(k?'k='+k+'&':'')+'t='+tab);}
function b64u(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function dec(e,k){return crypto.subtle.importKey('raw',b64u(k),'AES-GCM',false,['decrypt']).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(e.iv)},key,b64u(e.ct));}).then(function(buf){return JSON.parse(new TextDecoder().decode(buf));});}
function dl(s){if(!s)return null;var x=Date.parse(String(s).replace(' ','T')+(String(s).length>10?':00+03:00':'T23:59:00+03:00'));return isNaN(x)?null:x;}
function rd(x){return new Date(x+3*3600e3);}
function dayTxt(x){var d=rd(x);return t('dow')[d.getUTCDay()]+' '+d.getUTCDate()+' '+t('mon')[d.getUTCMonth()];}
function dateTxt(s){if(!s)return t('standing');var m=String(s).match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/);if(!m)return s;return (m[3]?(+m[3])+' ':'')+t('mon')[+m[2]-1]+' '+m[1];}
function range(r){return dateTxt(r.date)+(r.end?' – '+dateTxt(r.end):'');}
function isOpen(r){var x=dl(r.deadline);return x&&x>Date.now();}
function hl(node,text,q){node.textContent='';var s=String(text==null?'':text);if(!q){node.textContent=s;return node;}var lo=s.toLowerCase(),i=0,j;while((j=lo.indexOf(q,i))>=0){node.appendChild(document.createTextNode(s.slice(i,j)));node.appendChild(el('mark',null,s.slice(j,j+q.length)));i=j+q.length;}node.appendChild(document.createTextNode(s.slice(i)));return node;}
function pill(x,c){return el('span','pill '+c,x);}
function fmtN(n){return Number(n).toLocaleString('en-US');}
function secOf(r){return SECS.filter(function(s){return s.key===r.section;})[0]||SECS[0];}

function statics(){document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';document.title=t('title');
 document.querySelectorAll('[data-t]').forEach(function(n){n.textContent=t(n.dataset.t);});
 $('q').placeholder=t('search');$('q').setAttribute('aria-label',t('search'));$('qx').setAttribute('aria-label',t('clear'));$('nav').setAttribute('aria-label',t('sections'));
 var lb=$('lang');lb.textContent=t('other');lb.title=t('otherTip');lb.setAttribute('aria-label',t('otherTip'));lb.setAttribute('lang',L==='ar'?'en':'ar');
 $('et-disc').setAttribute('aria-label',t('disc'));}
function buildTabs(){var w=$('tabs');w.textContent='';TABS.forEach(function(id){var b=el('button');b.type='button';b.setAttribute('role','tab');b.dataset.tab=id;b.appendChild(document.createTextNode(t(id)));var n=el('span','n');n.id='n-'+id;if(id==='overview')n.hidden=true;b.appendChild(n);
 b.onclick=function(){$('q').value='';search('');go(id,true);var y=document.querySelector('header.band').offsetHeight;if(window.scrollY>y)window.scrollTo(0,y);};w.appendChild(b);});}
function counts(){$('n-etimad').textContent=D.etimad.filter(isOpen).length;SECS.forEach(function(s){$('n-'+s.id).textContent=D.watch.filter(function(r){return r.section===s.key;}).length;});$('n-dates').textContent=upcoming().length;}
function go(id,push){if(TABS.indexOf(id)<0)id='overview';st.tab=id;document.querySelectorAll('nav.tabs button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===id));});document.querySelectorAll('section[data-tab]').forEach(function(s){s.hidden=s.dataset.tab!==id;});$('v-search').hidden=true;if(push)setHash(id);}

function overview(){var open=D.etimad.filter(isOpen).sort(function(a,b){return dl(a.deadline)-dl(b.deadline);});var soon=open.filter(function(r){return dl(r.deadline)-Date.now()<=7*864e5;});var strong=open.filter(function(r){return r.fit==='Strong';});
 var tk=$('take');tk.textContent='';if(open.length){t('takeN')(open.length,strong.length,dayTxt(dl(open[0].deadline))).forEach(function(p){tk.appendChild(p[1]?el('b',null,String(p[0])):document.createTextNode(p[0]));});}else tk.textContent=t('takeNone');
 var F={};(D.figures||[]).forEach(function(x){F[x.key]=x;});
 var tiles=[{l:t('tOpen'),v:String(open.length),s:t('tOpenS')(strong.length,open.length-strong.length)},{l:t('tSoon'),v:String(soon.length),s:t('tSoonS')(soon.length?dayTxt(dl(soon[0].deadline)):'')}];
 ['gami_localization','iktva'].forEach(function(k){var x=F[k];if(!x)return;var s=[];var lrm=String.fromCharCode(8206);if(x.prev!=null)s.push(f(x,'prevLabel')+': '+lrm+x.prev+x.unit);if(x.target!=null)s.push(f(x,'targetLabel')+': '+lrm+x.target+x.unit);s.push(f(x,'source')+(L==='ar'?'، ':', ')+dateTxt(x.date));tiles.push({l:t('fig')[k],v:x.value+x.unit,s:s.join(' · '),u:x.url});});
 var TT=$('tiles');TT.textContent='';tiles.forEach(function(x){var d=el('div','tile');d.append(el('span','l',x.l),el('span','v',x.v));var s=el('span','s');if(x.u){var a=el('a',null,x.s);a.href=x.u;a.target='_blank';a.rel='noopener noreferrer';s.appendChild(a);}else s.textContent=x.s;d.appendChild(s);TT.appendChild(d);});
 var S=$('ov-soon');S.textContent='';if(!open.length)S.appendChild(el('div','empty',t('noOpen')));open.slice(0,5).forEach(function(r){S.appendChild(resBtn(r.title,dayTxt(dl(r.deadline))+' · '+r.agency+' · '+t(r.fit),'etimad','et-'+r.rn,true));});
 var LL=$('ov-latest');LL.textContent='';D.watch.filter(function(r){return r.kind!=='Event'&&r.date;}).sort(function(a,b){return String(b.date).localeCompare(String(a.date));}).slice(0,5).forEach(function(r){LL.appendChild(resBtn(f(r,'title'),dateTxt(r.date)+' · '+t('sec')[r.section]+' · '+t('kind')[r.kind],secOf(r).id,'w-'+r.id));});}
function snip(txt,q){var s=String(txt||''),i=s.toLowerCase().indexOf(q);if(i<0)return '';var a=Math.max(0,i-60),b=Math.min(s.length,i+q.length+80);return (a>0?'…':'')+s.slice(a,b)+(b<s.length?'…':'');}
function resBtn(title,meta,tab,target,ar,q,extra){var b=el('button');b.type='button';var tt=hl(el('span','t'),title,q);if(ar){tt.setAttribute('lang','ar');tt.dir='rtl';}b.append(tt,hl(el('span','m'),meta,q));
 if(q&&extra&&String(title).toLowerCase().indexOf(q)<0&&String(meta).toLowerCase().indexOf(q)<0){var sn=snip(extra,q);if(sn)b.appendChild(hl(el('span','x'),sn,q));}
 b.onclick=function(){$('q').value='';search('');go(tab,true);var x=$(target);if(x){x.scrollIntoView({block:'center',behavior:'smooth'});x.classList.remove('flash');void x.offsetWidth;x.classList.add('flash');}};return b;}

function etimad(){var sel=$('et-disc');sel.textContent='';sel.appendChild(new Option(t('allDisc'),''));var ds={};D.etimad.forEach(function(r){ds[r.discipline]=f(r,'discipline');});Object.keys(ds).sort().forEach(function(k){sel.appendChild(new Option(ds[k],k));});sel.value=st.disc;
 $('et-tools').querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.fit===st.fit));});
 var rows=D.etimad.filter(function(r){return (st.closed||isOpen(r))&&(!st.fit||r.fit===st.fit)&&(!st.disc||r.discipline===st.disc);}).sort(function(a,b){var oa=isOpen(a),ob=isOpen(b);if(oa!==ob)return oa?-1:1;return dl(a.deadline)-dl(b.deadline);});
 var B=$('et-body');B.textContent='';if(!rows.length){var tr0=el('tr'),td0=el('td','empty',t('noMatch'));td0.colSpan=7;tr0.appendChild(td0);B.appendChild(tr0);return;}
 rows.forEach(function(r){var tr=el('tr');tr.id='et-'+r.rn;var x=dl(r.deadline),open=isOpen(r),days=Math.max(1,Math.ceil((x-Date.now())/864e5));if(!open)tr.className='closed';
  var td=el('td','d',dayTxt(x)+' '+String(r.deadline).slice(11,16));td.appendChild(el('br'));if(!open)td.appendChild(pill(t('closed'),'closedp'));else if(days<=7)td.appendChild(pill(t('daysLeft')(days),'soon'));tr.appendChild(td);
  var tt=el('td','ar',r.title);tt.setAttribute('lang','ar');var nt=f(r,'note');if(nt){var sm=el('small',null,nt);sm.dir=L==='ar'?'rtl':'ltr';sm.style.textAlign=L==='ar'?'right':'left';sm.setAttribute('lang',L);tt.appendChild(sm);}tr.appendChild(tt);
  var ag=el('td','ar',r.agency);ag.setAttribute('lang','ar');ag.style.minWidth='170px';if(/مباشر/.test(r.type||'')){ag.appendChild(el('br'));ag.appendChild(pill(t('dp'),'dp'));}tr.appendChild(ag);
  tr.appendChild(el('td',null,f(r,'discipline')));var fc=el('td');fc.appendChild(pill(t(r.fit),r.fit));tr.appendChild(fc);tr.appendChild(el('td','n',r.booklet?fmtN(r.booklet):'—'));tr.appendChild(el('td','n',r.rn));B.appendChild(tr);});}

function card(r){var li=el('li','card');li.id='w-'+r.id;var m=el('div','meta');m.append(el('span','kind',t('kind')[r.kind]),el('span',null,range(r)));
 var w=el('p','why');w.append(el('b',null,t('forSlfe')),el('span',null,f(r,'slfe')));var s=el('p','meta');var a=el('a',null,t('source')+f(r,'source'));a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';s.appendChild(a);
 li.append(m,el('h3',null,f(r,'title')),el('p',null,f(r,'detail')),w,s);return li;}
function section(s){var v=$('v-'+s.id);v.textContent='';var h=el('div','sec-h');h.append(el('h2',null,t('secTitle')[s.id]),el('p',null,t('secIntro')[s.id]));v.appendChild(h);
 var items=D.watch.filter(function(r){return r.section===s.key;}),kinds=[];items.forEach(function(r){if(kinds.indexOf(r.kind)<0)kinds.push(r.kind);});
 var tools=el('div','tools');[''].concat(kinds).forEach(function(k){var b=el('button','chip',k?t('kind')[k]:t('all'));b.type='button';b.setAttribute('aria-pressed',String((st.kind[s.id]||'')===k));b.onclick=function(){st.kind[s.id]=k;section(s);};tools.appendChild(b);});v.appendChild(tools);
 var ul=el('ul','list');items.filter(function(r){return !st.kind[s.id]||r.kind===st.kind[s.id];}).sort(function(a,b){return String(b.date||'0').localeCompare(String(a.date||'0'));}).forEach(function(r){ul.appendChild(card(r));});
 if(!ul.children.length)ul.appendChild(el('li','empty',t('nothing')));v.appendChild(ul);}
function upcoming(){var today=new Date(Date.now()+3*3600e3).toISOString().slice(0,10);return D.watch.filter(function(r){var e=String(r.end||r.date||'');return r.kind==='Event'&&e>=today.slice(0,e.length);}).sort(function(a,b){return String(a.date).localeCompare(String(b.date));});}
function dates(){var B=$('dt-body');B.textContent='';var ev=upcoming();if(!ev.length){var tr0=el('tr'),td0=el('td','empty',t('noDates'));td0.colSpan=4;tr0.appendChild(td0);B.appendChild(tr0);}
 ev.forEach(function(r){var tr=el('tr');tr.append(el('td','d',range(r)));var c=el('td');var a=el('a',null,f(r,'title'));a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';a.style.fontWeight='600';c.appendChild(a);tr.append(c,el('td',null,t('sec')[r.section]),el('td',null,f(r,'slfe')));B.appendChild(tr);});}

function search(raw){q0=String(raw||'');var q=q0.trim().toLowerCase();$('qx').hidden=!q;var V=$('v-search');if(!q||!D){V.hidden=true;go(st.tab,false);return;}
 document.querySelectorAll('section[data-tab]').forEach(function(s){s.hidden=true;});document.querySelectorAll('nav.tabs button').forEach(function(b){b.setAttribute('aria-selected','false');});V.hidden=false;V.textContent='';
 var h=el('div','sec-h');h.append(el('h2',null,t('resH')),el('p',null,t('resP')(q0.trim())));V.appendChild(h);
 function has(o,keys){return keys.some(function(k){return String(o[k]||'').toLowerCase().indexOf(q)>=0;});}
 var et=D.etimad.filter(function(r){return has(r,['title','agency','discipline','disciplineAr','note','noteAr','rn','type']);}),total=et.length;
 if(et.length){V.appendChild(el('p','res-h',t('resEt')+' ('+et.length+')'));var R=el('div','res');et.forEach(function(r){R.appendChild(resBtn(r.title,(isOpen(r)?dayTxt(dl(r.deadline)):t('closed'))+' · '+r.agency+' · '+f(r,'discipline')+' · '+r.rn,'etimad','et-'+r.rn,true,q,[r.note,r.noteAr].join(' ')));});V.appendChild(R);}
 SECS.forEach(function(s){var it=D.watch.filter(function(r){return r.section===s.key&&has(r,['title','titleAr','detail','detailAr','slfe','slfeAr','source','sourceAr']);});total+=it.length;if(!it.length)return;
  V.appendChild(el('p','res-h',t('secTitle')[s.id]+' ('+it.length+')'));var R=el('div','res');it.forEach(function(r){R.appendChild(resBtn(f(r,'title'),range(r)+' · '+t('kind')[r.kind]+' · '+f(r,'source'),s.id,'w-'+r.id,false,q,[r.detail,r.detailAr,r.slfe,r.slfeAr,r.title,r.titleAr].join(' ')));});V.appendChild(R);});
 if(!total)V.appendChild(el('p','empty',t('resNone')));}

function render(){statics();buildTabs();if(!D)return;var u=Date.parse(D.updated);$('upd').textContent=isNaN(u)?'':t('updated')+' '+dayTxt(u)+' '+rd(u).toISOString().slice(0,4)+(L==='ar'?'، ':', ')+rd(u).toISOString().slice(11,16)+' '+t('riyadh');
 counts();overview();etimad();SECS.forEach(section);dates();if(q0.trim())search(q0);else go(st.tab,false);}
function fail(msg){statics();$('upd').textContent='';document.querySelectorAll('section[data-tab]').forEach(function(s){s.hidden=true;});$('nav').hidden=true;var m=$('main');var old=m.querySelector('.err');if(old)old.remove();m.insertBefore(el('div','err',msg),m.firstChild);}
function wire(){$('et-tools').querySelectorAll('.chip').forEach(function(b){b.onclick=function(){st.fit=b.dataset.fit;etimad();};});
 $('et-disc').onchange=function(){st.disc=this.value;etimad();};$('et-closed').onchange=function(){st.closed=this.checked;etimad();};
 var tmr;$('q').addEventListener('input',function(){var v=this.value;clearTimeout(tmr);tmr=setTimeout(function(){search(v);},120);});
 $('q').addEventListener('keydown',function(e){if(e.key==='Escape'){this.value='';search('');}});
 $('qx').onclick=function(){$('q').value='';search('');$('q').focus();};
 $('lang').onclick=function(){L=L==='ar'?'en':'ar';try{localStorage.setItem('slfeLang',L);}catch(e){}if(D)render();else{statics();var er=document.querySelector('.err');if(er)er.textContent=er.dataset.k?t(er.dataset.k):er.textContent;}};
 window.addEventListener('hashchange',function(){var x=hp().t;if(x&&x!==st.tab&&!q0.trim())go(x,false);});}
statics();buildTabs();wire();$('take').textContent=t('loading');
var K=hp().k;
if(!K){fail(t('needLink'));document.querySelector('.err').dataset.k='needLink';}
else fetch('data.enc.json?nc='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(e){return dec(e,K);}).then(function(d){D=d;D.etimad=D.etimad||[];D.watch=D.watch||[];D.figures=D.figures||[];st.tab=TABS.indexOf(hp().t)>=0?hp().t:'overview';render();}).catch(function(e){var bad=e&&e.name==='OperationError';fail(bad?t('badKey'):t('loadErr')(e&&e.message));if(bad)document.querySelector('.err').dataset.k='badKey';});
})();
