<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLFE Opportunity Watch</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap">
<style>
/* SLFE look: teal-black band, petrol accent, slate text. Tabs, search, EN/AR. */
:root{--ink:#011C1A;--petrol:#004D69;--petrol-2:#0A6F93;--bg:#F4F7F7;--panel:#FFFFFF;--fg:#14211F;--muted:#5E626C;--line:#DCE4E5;--soft:#E7F0F3;--ok:#1F7A4D;--warn:#A86400;--bad:#B3261E;--accent:#004D69;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#071513;--panel:#0E1F1D;--fg:#E6EEEE;--muted:#9AA8AA;--line:#203533;--soft:#0F2A31;--ok:#5CC28C;--warn:#E5A23A;--bad:#F07167;--accent:#5FB3D3;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
html[lang=ar] body,[lang=ar]{font-family:"Noto Kufi Arabic","DM Sans",sans-serif}
html[lang=ar] body{font-size:14.5px;line-height:1.8}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main .wrap>*,.res>*,.cols>*{min-width:0}
header.band{background:var(--ink);color:#EAF2F2;border-bottom:4px solid var(--petrol)}
header.band .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:18px}
.brand{display:grid;gap:2px;min-width:0}
.brand .mark{font-weight:800;letter-spacing:.16em;font-size:12px;color:#9FC3CF}
html[lang=ar] .brand .mark{letter-spacing:0}
.brand h1{margin:0;font-size:24px;line-height:1.2;font-weight:700}
.brand .upd{font-size:12.5px;color:#A9BBBD}
.right{display:flex;gap:10px;align-items:center;flex:1 1 320px;max-width:520px}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;padding:10px 14px;padding-inline-end:36px;border-radius:8px;border:1px solid #2C4A4A;background:#0B2A2C;color:#EAF2F2;font:inherit}
.search input::placeholder{color:#8FA5A7}
.search input:focus,.lang:focus-visible{outline:2px solid var(--petrol-2);outline-offset:1px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:#9FC3CF;font-size:18px;cursor:pointer;padding:4px 8px}
.lang{flex:0 0 auto;border:1px solid #2C4A4A;background:#0B2A2C;color:#EAF2F2;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;min-width:52px}
.lang:hover{border-color:#9FC3CF}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:13px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .n{display:inline-block;min-width:20px;margin-inline-start:6px;padding:0 6px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
main .wrap{padding-block:24px 48px;display:grid;gap:22px}
main section{display:grid;gap:14px;align-content:start}
.sec-h{display:grid;gap:4px;border-inline-start:3px solid var(--petrol);padding-inline-start:12px}
.sec-h h2{margin:0;font-size:20px;color:var(--accent)}
.sec-h p{margin:0;color:var(--muted);max-width:75ch}
.take{font-size:19px;line-height:1.5;margin:0;max-width:70ch}
.take b{font-variant-numeric:tabular-nums;color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--petrol);border-radius:10px;padding:16px;display:grid;gap:4px;align-content:start}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
html[lang=ar] .tile .l,html[lang=ar] th,html[lang=ar] .res-h,html[lang=ar] .card .kind{letter-spacing:0}
.tile .v{font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px}
.col{display:grid;gap:12px;align-content:start}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
select,.tools label{font:inherit;font-size:13.5px}
select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:start;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--soft);padding:9px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;text-align:start}
td.n,td.d{font-variant-numeric:tabular-nums;white-space:nowrap}
td.ar{direction:rtl;text-align:right;min-width:260px}
td.ar small{display:block;color:var(--muted);margin-top:3px}
tr.closed td{opacity:.55}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid currentColor;white-space:nowrap;margin-top:3px}
.pill.Strong{color:var(--ok)}.pill.Medium{color:var(--accent)}.pill.soon{color:var(--bad)}.pill.dp{color:var(--warn)}.pill.closedp{color:var(--muted)}
.list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .kind{font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.card h3{margin:0;font-size:16px}
.card p{margin:0;max-width:80ch}
.card .why{background:var(--soft);border-radius:6px;padding:6px 10px}
.card .why b{color:var(--accent)}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
.filters{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.frow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.flabel{flex:0 0 70px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
html[lang=ar] .flabel{letter-spacing:0;flex-basis:80px}
.mkq{display:flex;gap:8px;flex:1;min-width:0;max-width:520px}
.mkq input{flex:1;min-width:0;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px}
.mkq input:focus{outline:2px solid var(--petrol-2);outline-offset:1px}
.chip .c{margin-inline-start:6px;opacity:.7;font-variant-numeric:tabular-nums}
.mkcount{margin:0;color:var(--muted);font-size:13px}
.card .area{font-weight:700;color:var(--fg);background:var(--soft);border-radius:999px;padding:0 8px}
.opp{display:inline-block;font-size:11.5px;font-weight:800;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 6px;margin-inline-end:4px;white-space:nowrap}
.pill.Prioritise{color:var(--ok)}.pill.Monitor{color:var(--muted)}.pill.Hold{color:var(--warn)}.pill.Exclude{color:var(--bad)}
.hint{margin:-2px 0 0;font-size:12.5px;color:var(--muted);flex-basis:100%;padding-inline-start:82px}
html[lang=ar] .hint{padding-inline-start:92px}
@media (max-width:560px){.hint{padding-inline-start:0}}
.purp{font-size:13px;color:#C9D8DA;max-width:62ch}
.route{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
mark{background:#FFE58A;color:#111;border-radius:2px;padding:0 1px}
.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--petrol-2)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.res-h{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 0}
.res{display:grid;gap:8px}
.res button{all:unset;cursor:pointer;display:grid;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:start}
.res button:hover,.res button:focus-visible{border-color:var(--accent);outline:none}
.res .t{font-weight:600}
.res .m{font-size:12.5px;color:var(--muted)}
.res .x{font-size:13px}
footer{color:var(--muted);font-size:12.5px}
footer details summary{cursor:pointer;font-weight:600;color:var(--accent)}
footer ul{margin:8px 0 0;padding-inline-start:18px;display:grid;gap:4px}
.err{background:var(--panel);border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:14px}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brand">
      <span class="mark" data-t="mark"></span>
      <h1 data-t="title"></h1>
      <span class="purp" data-t="purpose"></span>
      <span class="upd" id="upd"></span>
    </div>
    <div class="right">
      <div class="search">
        <input id="q" type="search" autocomplete="off">
        <button id="qx" type="button" hidden>×</button>
      </div>
      <button class="lang" id="lang" type="button"></button>
    </div>
  </div>
</header>
<nav class="tabs" id="nav"><div class="wrap" id="tabs" role="tablist"></div></nav>
<main><div class="wrap" id="main">
  <section id="v-search" hidden></section>
  <section id="v-overview" data-tab="overview">
    <p class="take" id="take"></p>
    <div class="tiles" id="tiles"></div>
    <div class="cols">
      <div class="col"><div class="sec-h"><h2 data-t="soonH"></h2><p data-t="soonP"></p></div><div class="res" id="ov-soon"></div></div>
      <div class="col"><div class="sec-h"><h2 data-t="latestH"></h2><p data-t="latestP"></p></div><div class="res" id="ov-latest"></div></div>
    </div>
  </section>
  <section id="v-etimad" data-tab="etimad" hidden>
    <div class="sec-h"><h2 data-t="etH"></h2><p data-t="etP"></p></div>
    <div class="tools" id="et-tools">
      <button class="chip" type="button" data-fit="" aria-pressed="true" data-t="all"></button>
      <button class="chip" type="button" data-fit="Strong" aria-pressed="false" data-t="Strong"></button>
      <button class="chip" type="button" data-fit="Medium" aria-pressed="false" data-t="Medium"></button>
      <select id="et-disc"></select>
      <label><input type="checkbox" id="et-closed"> <span data-t="showClosed"></span></label>
    </div>
    <div class="tbl"><table><thead><tr><th data-t="thClose"></th><th data-t="thTender"></th><th data-t="thBuyer"></th><th data-t="thDisc"></th><th data-t="thOpp"></th><th data-t="thFit"></th><th data-t="thBook"></th><th data-t="thRn"></th></tr></thead><tbody id="et-body"></tbody></table></div>
  </section>
  <section id="v-market" data-tab="market" hidden>
    <div class="sec-h"><h2 data-t="mkH"></h2><p data-t="mkP"></p></div>
    <div class="filters">
      <div class="frow"><span class="flabel" data-t="fArea"></span><div class="tools" id="mk-area"></div></div>
      <div class="frow"><span class="flabel" data-t="fType"></span><div class="tools" id="mk-kind"></div><p class="hint" id="mk-hint"></p></div>
      <div class="frow"><span class="flabel" data-t="fOpp"></span><div class="tools" id="mk-opp"></div></div>
      <div class="frow"><span class="flabel" data-t="fWord"></span><div class="mkq"><input id="mk-q" type="search" autocomplete="off"><button id="mk-reset" type="button" class="chip" data-t="reset"></button></div></div>
    </div>
    <p class="mkcount" id="mk-count"></p>
    <ul class="list" id="mk-list"></ul>
  </section>
  <section id="v-dates" data-tab="dates" hidden>
    <div class="sec-h"><h2 data-t="dtH"></h2><p data-t="dtP"></p></div>
    <div class="tbl"><table><thead><tr><th data-t="thDates"></th><th data-t="thEvent"></th><th data-t="thArea"></th><th data-t="thWhy"></th></tr></thead><tbody id="dt-body"></tbody></table></div>
  </section>
  <footer>
    <details><summary data-t="howH"></summary>
      <ul><li data-t="how1"></li><li data-t="how2"></li><li data-t="how3"></li><li data-t="how4"></li><li data-t="how5"></li></ul>
    </details>
  </footer>
</div></main>
